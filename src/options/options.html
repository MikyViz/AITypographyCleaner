<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Настройки — AI Typography Cleaner</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>AI Typography Cleaner — настройки</h1>

      <section>
        <h2>Тема оформления</h2>
        <label class="dash-row">
          <span>Тема</span>
          <select id="theme">
            <option value="system">Системная</option>
            <option value="light">Светлая</option>
            <option value="dark">Тёмная</option>
          </select>
        </label>
      </section>

      <section>
        <h2>Группы правил</h2>
        <label><input type="checkbox" id="quotes" /> Кавычки ( “ ” „ « » ‘ ’ ‹ › → " и ' )</label>
        <label class="dash-row">
          <span><input type="checkbox" id="dashes" /> Тире (— / – → дефис)</span>
          <select id="dashMode">
            <option value=" - ">" - " (с пробелами)</option>
            <option value="-">"-" (без пробелов)</option>
            <option value=", ">", " (запятая)</option>
          </select>
        </label>
        <label><input type="checkbox" id="ellipsis" /> Многоточие ( … → ... )</label>
        <label><input type="checkbox" id="spaces" /> Спецпробелы → обычный пробел</label>
        <label><input type="checkbox" id="invisibles" /> Удалять невидимые символы</label>
        <label><input type="checkbox" id="misc" /> Прочее (минус, буллеты, стрелки, ×, праймы)</label>
        <label><input type="checkbox" id="emojis" /> Удалять смайлики (эмодзи 😀, флаги, ©/®/™)</label>
        <label><input type="checkbox" id="collapseSpaces" /> Схлопывать двойные пробелы</label>
      </section>

      <section>
        <h2>Whitelist доменов</h2>
        <p>Автоматическая очистка при копировании (Ctrl+C) работает только на этих сайтах.</p>
        <ul id="whitelist"></ul>
        <div class="add-domain">
          <input id="new-domain" type="text" placeholder="example.com" />
          <button id="add-domain">Добавить</button>
        </div>
      </section>

      <p id="status" class="status" role="status"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
